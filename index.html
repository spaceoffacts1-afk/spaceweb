<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Space Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#050816;color:#fff;overflow-x:hidden;transition:.4s}
body.light{background:#eef3ff;color:#111}
#stars,#stars:after{
position:fixed;left:0;top:0;width:2px;height:2px;
background:white;
box-shadow:
20vw 10vh #fff,40vw 80vh #fff,60vw 40vh #fff,80vw 20vh #fff,
10vw 60vh #fff,70vw 90vh #fff,90vw 70vh #fff,35vw 25vh #fff,
55vw 15vh #fff,75vw 55vh #fff,15vw 85vh #fff,95vw 5vh #fff,
5vw 35vh #fff,25vw 95vh #fff,45vw 65vh #fff,65vw 75vh #fff,
85vw 45vh #fff,30vw 50vh #fff,50vw 5vh #fff;
animation:move 45s linear infinite;
content:"";
}
#stars:after{top:100vh}
@keyframes move{to{transform:translateY(-100vh)}}
header{
position:sticky;top:0;z-index:2;
display:flex;gap:10px;align-items:center;
padding:15px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px)
}
body.light header{background:#dfe9ff}
h1{flex:1;font-size:26px}
input{
padding:10px;border:none;border-radius:8px;width:220px
}
button,a{
padding:10px 15px;border:none;border-radius:8px;
background:#3d7bff;color:#fff;text-decoration:none;cursor:pointer
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;padding:25px
}
.card{
background:rgba(255,255,255,.08);
border-radius:15px;padding:18px;
text-align:center;cursor:pointer;
transition:.3s
}
body.light .card{background:#fff}
.card:hover{transform:translateY(-8px) scale(1.03)}
.card img{
width:120px;height:120px;border-radius:50%;
object-fit:cover;margin:10px auto;
border:3px solid #4ba3ff
}
.card h2{margin:10px 0}
.modal{
display:none;position:fixed;
left:0;top:0;width:100%;height:100%;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
padding:20px;z-index:10
}
.modal-box{
background:#111;
max-width:800px;
width:100%;
border-radius:15px;
overflow:hidden;
animation:pop .3s
}
body.light .modal-box{background:#fff;color:#111}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.modal img{
width:100%;
max-height:420px;
object-fit:cover
}
.content{padding:20px}
.close{
float:right;
font-size:28px;
cursor:pointer
}
@media(max-width:600px){
header{flex-wrap:wrap}
input{width:100%}
}
</style>
</head>
<body>
<div id="stars"></div>

<header>
<h1>🚀 Space Explorer</h1>
<input id="search" placeholder="Search planet...">
<button onclick="toggleMode()">🌙</button>
<a href="index.html">🏠 Home</a>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="modal-box">
<div class="content">
<span class="close" onclick="closeModal()">✖</span>
<h2 id="title"></h2>
</div>
<img id="photo">
<div class="content">
<p id="facts"></p>
</div>
</div>
</div>

<script>
const planets=[
{
name:"Mercury",
img:"https://upload.wikimedia.org/wikipedia/commons/4/4a/Mercury_in_true_color.jpg",
facts:"Closest planet to the Sun. A year lasts only 88 Earth days."
},
{
name:"Venus",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg",
facts:"Hottest planet with thick carbon dioxide clouds."
},
{
name:"Earth",
img:"https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg",
facts:"Our home planet and the only known world with life."
},
{
name:"Moon",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg",
facts:"Earth's natural satellite causing tides and eclipses."
},
{
name:"Mars",
img:"https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg",
facts:"Known as the Red Planet with the largest volcano in the Solar System."
},
{
name:"Jupiter",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg",
facts:"Largest planet famous for the Great Red Spot."
},
{
name:"Saturn",
img:"https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg",
facts:"Best known for its spectacular rings."
},
{
name:"Uranus",
img:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Uranus2.jpg",
facts:"Rotates on its side and appears blue-green."
},
{
name:"Neptune",
img:"https://upload.wikimedia.org/wikipedia/commons/5/56/Neptune_Full.jpg",
facts:"The farthest major planet with the fastest winds."
}
];

const grid=document.getElementById("grid");

function show(list){
grid.innerHTML="";
list.forEach(p=>{
grid.innerHTML+=`
<div class="card" onclick="openModal('${p.name}')">
<img src="${p.img}">
<h2>${p.name}</h2>
<p>Click for details</p>
</div>`;
});
}
show(planets);

function openModal(name){
let p=planets.find(x=>x.name===name);
title.textContent=p.name;
photo.src=p.img;
facts.textContent=p.facts;
modal.style.display="flex";
}
function closeModal(){
modal.style.display="none";
}
window.onclick=e=>{
if(e.target==modal)closeModal();
}

search.oninput=()=>{
let t=search.value.toLowerCase();
show(planets.filter(p=>p.name.toLowerCase().includes(t)));
}

function toggleMode(){
document.body.classList.toggle("light");
}
</script>
</body>
</html>
